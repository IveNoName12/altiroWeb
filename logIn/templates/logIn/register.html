{% extends "logIn/base.html" %}
{% load static %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}
    <form class="login-form" method="post">
                {% csrf_token %}
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" autocomplete="email" required placeholder="ejemplo@dominio.com">

                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" autocomplete="name" required placeholder="Tu nombre">

                <label for="lastname">Apellido</label>
                <input type="text" id="lastname" name="lastname" autocomplete="family-name" required placeholder="Tu apellido">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                
                <label for="confirm_password">Confirmar contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" autocomplete="current-password" required>

                <button type="submit" class="btn-login">Continuar</button>
            </form>
{% endblock %}
